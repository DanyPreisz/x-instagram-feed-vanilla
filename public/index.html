<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed · X / Instagram</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">X / Instagram</p>
      <div class="head"><h1>Feed</h1><span id="store" class="pill">…</span></div>

        <textarea id="text" maxlength="280" placeholder="Qué hay" required></textarea>
        <button type="submit">Publicar</button>
      </form>
      <div id="feed"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
